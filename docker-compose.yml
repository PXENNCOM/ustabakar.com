services:
  db:
    image: mariadb:10.11
    container_name: usta_db
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build: ./server
    container_name: usta_server
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      PORT: 3001
      SMS_ENABLED: ${SMS_ENABLED}
      ILETIMERKEZI_KEY: ${ILETIMERKEZI_KEY}
      ILETIMERKEZI_SECRET: ${ILETIMERKEZI_SECRET}
      ILETIMERKEZI_SENDER: ${ILETIMERKEZI_SENDER}
      OTP_SECRET: ${OTP_SECRET}
    volumes:
      - ./server/uploads:/app/uploads

  client:
    build:
      context: ./client
      args:
        VITE_API_URL: https://ustabakar.com/api
    container_name: usta_client
    restart: always
    depends_on:
      - server
    ports:
      - "127.0.0.1:3000:80"

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: usta_phpmyadmin
    restart: always
    depends_on:
      - db
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:8080:80"

volumes:
  db_data: